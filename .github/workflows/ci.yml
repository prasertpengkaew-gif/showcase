# Typecheck, production build (including prerender), headless logic tests,
# then the Playwright SEO and end-to-end suites.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # ubuntu-latest is 26.04, which Playwright 1.56 cannot install Chromium for.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Logic tests
        run: |
          npm run test:sql
          npm run test:admin
          npm run test:map
          npm run test:rag
          npm run test:tms
          npm run test:coldroom
          npm run test:vote
          npm run test:halloween
          npm run test:rally
          npm run test:tools
          npm run test:season
          npm run validate:models
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: SEO
        run: npm run test:seo
      - name: End-to-end and accessibility
        run: npm run test:e2e
